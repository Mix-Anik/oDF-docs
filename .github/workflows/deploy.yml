name: Deploy docs

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      engine_ref:
        description: oDFe-upstream branch or tag the API reference is generated from
        default: feature/qvm-plugins
  # the engine repo can send this when client.api / server.api change
  repository_dispatch:
    types: [engine-changed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the API reference is generated from the engine's .api files, so it always matches it
      - uses: actions/checkout@v4
        with:
          repository: Mix-Anik/oDFe-upstream
          # the plugin API is not on the engine's main yet; switch this (and the input default) to main once it is merged
          ref: ${{ inputs.engine_ref || 'feature/qvm-plugins' }}
          path: engine
          sparse-checkout: code/plugin_api

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          ODFE_DIR: ${{ github.workspace }}/engine

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
